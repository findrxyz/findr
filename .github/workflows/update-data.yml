name: Update pool data

# Every 15 minutes: run one indexer pass for Ethereum, Base and Robinhood Chain, then publish the page with the
# fresh data files to GitHub Pages. The indexer's state and last good data files are carried between runs in the
# Actions cache, so a chain that fails in one run keeps its previous data instead of disappearing from the site.
#
# Deploys use the short-lived token GitHub issues to each run, scoped to this repo; no deploy secret is stored.
# Repository secret (optional): ALCHEMY_API_KEY, a backup RPC endpoint used only when the free public RPCs fail.
#
# Actions are pinned to commit SHAs so a moved or hijacked tag can't change what runs.

on:
  schedule:
    # Every 15 minutes, offset from :00/:15/:30/:45: GitHub delays or drops scheduled runs at those busy times.
    - cron: '7-59/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # lets a run queue the next one (see the last step)

# Runs queue instead of overlapping, since each one continues from the previous run's state.
concurrency:
  group: update-pool-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Note the start time
        run: echo "RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Prepare state folders
        run: mkdir -p indexer/state data

      - name: Restore indexer state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            indexer/state
            data
          key: indexer-${{ github.run_id }}
          restore-keys: indexer-

      - name: Index pools
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: node --no-warnings indexer/uniswap.mjs --once

      - name: Save indexer state
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            indexer/state
            data
          key: indexer-${{ github.run_id }}

      # Only the page and its data are published; the indexer, its state and local tooling stay out.
      - name: Collect the site
        run: |
          mkdir -p site
          cp index.html app.js styles.css site/
          cp -r data site/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # GitHub's scheduler hasn't started this workflow on its own, so each run also queues the next one about
      # 15 minutes after it started. A workflow_dispatch made with the run's own token is one of the few events
      # GitHub lets start another run. The concurrency group keeps at most one run waiting, so this and the
      # schedule can't pile up. Cancelling a run stops the chain; a manual or scheduled run restarts it.
      - name: Queue the next run
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait=$(( RUN_STARTED + 15 * 60 - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          gh workflow run update-data.yml --repo "$GITHUB_REPOSITORY" --ref main
